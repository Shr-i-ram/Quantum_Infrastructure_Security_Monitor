# QISM Research Dataset - Small Pilot Configuration
# Used for Stage A validation, schema checking, and throughput benchmarking.

dataset_id: "qism_research_pilot"
version: "0.5.0"
master_seed: 20261019
sampling_strategy: "latin_hypercube"
worker_count: 4
batch_size: 6
shard_size: 5
max_retries: 2
output_root: "data/pilot_test"
checkpoint_root: "checkpoints/pilot_test"

base: "v0.4_smoke.yaml"

splits:
  calibration:
    n_scenarios: 2
    runs_per_scenario: 1
    pulses_per_run: 5000
    edge_case_fraction: 0.0
    attack_fraction: 0.0

  train:
    n_scenarios: 3
    runs_per_scenario: 1
    pulses_per_run: 5000
    edge_case_fraction: 0.10
    attack_fraction: 0.0

  validation:
    n_scenarios: 3
    runs_per_scenario: 1
    pulses_per_run: 5000
    edge_case_fraction: 0.15
    attack_fraction: 0.35
    attack_types:
      - "intercept_resend"
      - "channel_loss"

  test_in_distribution:
    n_scenarios: 6
    runs_per_scenario: 1
    pulses_per_run: 5000
    edge_case_fraction: 0.15
    attack_fraction: 1.0
    attack_types:
      - "intercept_resend"
      - "channel_loss"
      - "source_manipulation"
      - "detector_manipulation"
      - "timing"
      - "pns"

  test_generalization:
    n_scenarios: 3
    runs_per_scenario: 1
    pulses_per_run: 5000
    edge_case_fraction: 0.25
    attack_fraction: 0.67
    attack_types:
      - "timing"
      - "pns"
      - "intercept_resend"
    held_out_dimensions:
      channel.distance_km:
        min: 50.0
        max: 75.0
      detectors.efficiency:
        min: 0.30
        max: 0.42

  test_stress:
    n_scenarios: 3
    runs_per_scenario: 1
    pulses_per_run: 5000
    edge_case_fraction: 1.0
    attack_fraction: 0.5
    attack_types:
      - "intercept_resend"
      - "channel_loss"
      - "source_manipulation"

population:
  source:
    mu_signal:
      distribution: "truncated_normal"
      mean: 0.50
      std: 0.05
      min_val: 0.25
      max_val: 0.70
      unit: "photons/pulse"
      description: "Mean photon number per signal pulse across population"
    mu_decoy:
      distribution: "truncated_normal"
      mean: 0.10
      std: 0.02
      min_val: 0.03
      max_val: 0.20
      unit: "photons/pulse"
      description: "Mean photon number for decoy pulses"

  channel:
    distance_km:
      distribution: "uniform"
      a: 10.0
      b: 45.0
      min_val: 5.0
      max_val: 60.0
      unit: "km"
      description: "Fiber link distance across deployment sites"
    attenuation_db_per_km:
      distribution: "normal"
      mean: 0.20
      std: 0.025
      min_val: 0.14
      max_val: 0.28
      unit: "dB/km"
      description: "Standard single-mode fiber attenuation coefficient"
    insertion_loss_db:
      distribution: "uniform"
      a: 0.5
      b: 2.5
      min_val: 0.2
      max_val: 4.0
      unit: "dB"
      description: "Coupling and connector loss at link endpoints"

  detectors:
    efficiency:
      distribution: "truncated_normal"
      mean: 0.16
      std: 0.03
      min_val: 0.06
      max_val: 0.28
      unit: "dimensionless"
      description: "Single-photon detector baseline quantum efficiency"
    dark_count_rate_hz:
      distribution: "log_normal"
      mean: 6.9
      std: 0.45
      min_val: 80.0
      max_val: 5000.0
      unit: "Hz"
      description: "Detector dark count rate across fabrication batches"
    timing_jitter_s:
      distribution: "uniform"
      a: 30.0e-12
      b: 80.0e-12
      min_val: 15.0e-12
      max_val: 150.0e-12
      unit: "s"
      description: "Detector timing resolution standard deviation"

  environment:
    temperature.baseline:
      distribution: "normal"
      mean: 21.0
      std: 2.5
      min_val: 14.0
      max_val: 32.0
      unit: "deg_C"
      description: "Laboratory ambient baseline operating temperature"
    humidity.baseline:
      distribution: "uniform"
      a: 35.0
      b: 70.0
      min_val: 15.0
      max_val: 85.0
      unit: "%"
      description: "Ambient relative humidity"
