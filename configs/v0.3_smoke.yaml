# QISM V0.3 Smoke Test Configuration
# Short run (10,000 pulses) with an intercept-resend attack episode
# to quickly verify the simulation pipeline, attack engine, and telemetry.

protocol:
  name: decoy_bb84
  n_pulses: 10000
  repetition_rate_hz: 1000000.0

source:
  bit_probability_zero: 0.5
  basis_z_probability: 0.5
  signal_probability: 0.80
  decoy_probability: 0.15
  vacuum_probability: 0.05
  mu_signal: 0.50
  mu_decoy: 0.10
  mu_vacuum: 0.00
  max_photon_number: 10

channel:
  distance_km: 25.0
  attenuation_db_per_km: 0.20
  insertion_loss_db: 1.0
  misalignment_deg: 1.0
  n_eff: 1.468
  speed_of_light_m_per_s: 299792458.0

background:
  enabled: true
  rate_hz: 1000.0

receiver:
  basis_z_probability: 0.5
  gate_width_s: 1.0e-9
  detection_interval_s: null
  double_click_policy: exclude

detectors:
  detector_0:
    label: D0
    efficiency: 0.15
    dark_count_rate_hz: 1000.0
    timing_jitter_s: 50.0e-12
  detector_1:
    label: D1
    efficiency: 0.15
    dark_count_rate_hz: 1000.0
    timing_jitter_s: 50.0e-12
  dead_time:
    enabled: true
    model: rate_dependent
    tau_dead_s: 50.0e-9
    recovery_model: hard_dead_time
    tau_0_s: 50.0e-9
    delta_tau_s: 50.0e-9
    lambda_c_hz: 1.0e6
    rate_estimation_window_pulses: 2000
  afterpulse:
    enabled: true
    probability: 0.01
    decay_model: exponential
    tau_afterpulse_s: 100.0e-9
  state:
    initial_state: ready

timing:
  histogram_bins: 20

environment:
  type: stable
  enabled: false

attack:
  enabled: true
  type: intercept_resend
  strength: 0.8
  start_pulse: 2000
  end_pulse: 8000
  params:
    fraction: 1.0
  scenarios:
    - scenario_id: smoke_ir
      type: intercept_resend
      severity: 0.8
      start_pulse: 2000
      end_pulse: 8000
      onset_pulses: 500
      termination_pulses: 500
      onset_profile: smoothstep
      recovery_profile: smoothstep
      params:
        fraction: 1.0
      description: "V0.3 smoke test intercept-resend attack"

telemetry:
  window_size: 2000
  timing_histogram_bins: 20
  include_event_level: true
  interarrival_histogram_bins: 30
  interarrival_histogram_scale: linear
  fano_sub_bins: 64

simulation:
  master_seed: 20240101
  chunk_size: 2000
  checkpoint_interval: 2000
  output_root: data/smoke
  checkpoint_root: checkpoints/smoke
  scenario_id: v0.3_smoke
  log_level: INFO

dataset:
  format: parquet
  family: attacks
  version: 0.3.0
