# QISM V0.4 Generalization Dataset Configuration
# Evaluates detection transfer on held-out attack types, held-out severity levels,
# and shifted environmental operating regimes (elevated baseline temperature, vibration, loss).

protocol:
  name: decoy_bb84
  n_pulses: 50000
  repetition_rate_hz: 1000000.0

source:
  bit_probability_zero: 0.5
  basis_z_probability: 0.5
  signal_probability: 0.80
  decoy_probability: 0.15
  vacuum_probability: 0.05
  mu_signal: 0.50
  mu_decoy: 0.10
  mu_vacuum: 0.00
  max_photon_number: 10
  intensity_jitter_std: 0.035  # Higher source jitter regime

channel:
  distance_km: 25.0
  attenuation_db_per_km: 0.22  # Shifted channel attenuation
  insertion_loss_db: 1.5       # Shifted insertion loss
  misalignment_deg: 1.5        # Shifted baseline misalignment
  n_eff: 1.468
  speed_of_light_m_per_s: 299792458.0
  loss_drift_enabled: true

background:
  enabled: true
  rate_hz: 1500.0              # Elevated baseline background noise
  ambient_coupling_factor: 6.0

receiver:
  basis_z_probability: 0.5
  gate_width_s: 1.0e-9
  detection_interval_s: null
  double_click_policy: exclude

detectors:
  detector_0:
    label: D0
    efficiency: 0.14           # Slightly degraded efficiency
    dark_count_rate_hz: 1200.0 # Higher baseline dark counts
    timing_jitter_s: 60.0e-12
    temp_coeff_dark_count: 0.03
    temp_coeff_efficiency: -0.001
    t_ref_c: 20.0
  detector_1:
    label: D1
    efficiency: 0.14
    dark_count_rate_hz: 1200.0
    timing_jitter_s: 60.0e-12
    temp_coeff_dark_count: 0.03
    temp_coeff_efficiency: -0.001
    t_ref_c: 20.0
  dead_time:
    enabled: true
    model: rate_dependent
    tau_dead_s: 55.0e-9
    recovery_model: hard_dead_time
    tau_0_s: 55.0e-9
    delta_tau_s: 50.0e-9
    lambda_c_hz: 1.0e6
    rate_estimation_window_pulses: 10000
  afterpulse:
    enabled: true
    probability: 0.015
    decay_model: exponential
    tau_afterpulse_s: 100.0e-9
  state:
    initial_state: ready

timing:
  histogram_bins: 20

environment:
  type: dynamic
  enabled: true
  temperature:
    baseline: 28.5             # Warmer regime (28.5 C vs 21.5 C)
    theta: 0.4
    sigma: 0.15
    diurnal_amplitude: 2.0
    diurnal_period_s: 3600.0
    min_val: 15.0
    max_val: 45.0
  humidity:
    baseline: 65.0             # More humid regime (65% vs 50%)
    theta: 0.15
    sigma: 0.8
    min_val: 0.0
    max_val: 100.0
  vibration:
    baseline: 0.05             # Higher vibration regime (0.05 g vs 0.02 g)
    theta: 0.8
    sigma: 0.01
    min_val: 0.0
    max_val: 1.0
  background_light:
    baseline: 300.0            # Elevated background light (300 vs 150)
    theta: 0.4
    sigma: 10.0
    min_val: 0.0
  polarization_drift:
    baseline: 1.5              # Non-zero baseline polarization offset
    theta: 0.08
    sigma: 0.08
    min_val: -10.0
    max_val: 10.0
  clock_drift:
    baseline: 25.0             # Larger clock drift baseline
    theta: 0.04
    sigma: 0.8
  channel_loss_drift:
    baseline: 0.5              # Baseline channel loss offset (+0.5 dB)
    theta: 0.15
    sigma: 0.03
  source_intensity_drift:
    baseline: -0.01            # Baseline source intensity offset
    theta: 0.4
    sigma: 0.008
  detector_efficiency_drift:
    baseline: -0.005           # Baseline efficiency offset
    theta: 0.4
    sigma: 0.008
  coupling:
    ambient_light_to_bg_rate: 6.0
    base_background_rate_hz: 1500.0
  sensors:
    temperature:
      noise_std: 0.15
      quantization_step: 0.1
      missing_probability: 0.02
      sampling_interval_s: 0.001
    humidity:
      noise_std: 0.8
      quantization_step: 0.5
      missing_probability: 0.02
      sampling_interval_s: 0.001
    vibration:
      noise_std: 0.004
      quantization_step: 0.001
      missing_probability: 0.02
      sampling_interval_s: 0.001
    background_light:
      noise_std: 3.0
      quantization_step: 1.0
      missing_probability: 0.02
      sampling_interval_s: 0.001

attack:
  enabled: true
  type: none
  strength: 0.0
  start_pulse: 0
  end_pulse: null
  params: {}
  scenarios:
    # 1. Held-out subtle severity (0.15) for Intercept-Resend
    - scenario_id: gen_ir_subtle_015
      type: intercept_resend
      severity: 0.15
      start_pulse: 10000
      end_pulse: 40000
      onset_pulses: 2000
      termination_pulses: 2000
      onset_profile: smoothstep
      recovery_profile: smoothstep
      params:
        fraction: 1.0
      description: "Held-out low severity intercept-resend (s=0.15) under shifted regime"

    # 2. Held-out extreme severity (0.85) for Channel Loss
    - scenario_id: gen_loss_severe_085
      type: channel_loss
      severity: 0.85
      start_pulse: 10000
      end_pulse: 40000
      onset_pulses: 2000
      termination_pulses: 2000
      onset_profile: smoothstep
      recovery_profile: smoothstep
      params:
        delta_L_max_db: 6.0
      description: "Held-out high severity channel loss (s=0.85, +5.1 dB) under shifted regime"

    # 3. Held-out attack type: Novel timing shift
    - scenario_id: gen_timing_novel_075
      type: timing
      severity: 0.75
      start_pulse: 10000
      end_pulse: 40000
      onset_pulses: 2000
      termination_pulses: 2000
      onset_profile: smoothstep
      recovery_profile: smoothstep
      params:
        delta_t_max_s: 250.0e-12
      description: "Held-out timing shift attack (s=0.75, +187.5 ps) under shifted regime"

    # 4. Held-out attack type: Novel PNS attack
    - scenario_id: gen_pns_novel_08
      type: pns
      severity: 0.8
      start_pulse: 10000
      end_pulse: 40000
      onset_pulses: 2000
      termination_pulses: 2000
      onset_profile: smoothstep
      recovery_profile: smoothstep
      params:
        single_photon_suppression: 0.7
      description: "Held-out PNS split/suppress attack (s=0.8) under shifted regime"

telemetry:
  window_size: 10000
  timing_histogram_bins: 20
  include_event_level: true
  interarrival_histogram_bins: 30
  interarrival_histogram_scale: linear
  fano_sub_bins: 64

simulation:
  master_seed: 20240401
  chunk_size: 10000
  checkpoint_interval: 10000
  output_root: data/v0.4
  checkpoint_root: checkpoints/v0.4
  scenario_id: generalization_suite
  log_level: INFO

dataset:
  format: parquet
  family: generalization
  version: 0.4.0
