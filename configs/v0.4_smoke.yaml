# QISM V0.4 Smoke Test Configuration
# Quick run (10,000 pulses) with dynamic environmental drift
# and an intercept-resend attack episode operating on top of dynamic telemetry.

protocol:
  name: decoy_bb84
  n_pulses: 10000
  repetition_rate_hz: 1000000.0

source:
  bit_probability_zero: 0.5
  basis_z_probability: 0.5
  signal_probability: 0.80
  decoy_probability: 0.15
  vacuum_probability: 0.05
  mu_signal: 0.50
  mu_decoy: 0.10
  mu_vacuum: 0.00
  max_photon_number: 10
  intensity_jitter_std: 0.02

channel:
  distance_km: 25.0
  attenuation_db_per_km: 0.20
  insertion_loss_db: 1.0
  misalignment_deg: 1.0
  n_eff: 1.468
  speed_of_light_m_per_s: 299792458.0
  loss_drift_enabled: true

background:
  enabled: true
  rate_hz: 1000.0
  ambient_coupling_factor: 5.0

receiver:
  basis_z_probability: 0.5
  gate_width_s: 1.0e-9
  detection_interval_s: null
  double_click_policy: exclude

detectors:
  detector_0:
    label: D0
    efficiency: 0.15
    dark_count_rate_hz: 1000.0
    timing_jitter_s: 50.0e-12
    temp_coeff_dark_count: 0.03
    temp_coeff_efficiency: -0.001
    t_ref_c: 20.0
  detector_1:
    label: D1
    efficiency: 0.15
    dark_count_rate_hz: 1000.0
    timing_jitter_s: 50.0e-12
    temp_coeff_dark_count: 0.03
    temp_coeff_efficiency: -0.001
    t_ref_c: 20.0
  dead_time:
    enabled: true
    model: rate_dependent
    tau_dead_s: 50.0e-9
    recovery_model: hard_dead_time
    tau_0_s: 50.0e-9
    delta_tau_s: 50.0e-9
    lambda_c_hz: 1.0e6
    rate_estimation_window_pulses: 2000
  afterpulse:
    enabled: true
    probability: 0.01
    decay_model: exponential
    tau_afterpulse_s: 100.0e-9
  state:
    initial_state: ready

timing:
  histogram_bins: 20

environment:
  type: dynamic
  enabled: true
  temperature:
    baseline: 21.5
    theta: 0.5
    sigma: 0.1
    diurnal_amplitude: 1.5
    diurnal_period_s: 3600.0
    min_val: 10.0
    max_val: 40.0
  humidity:
    baseline: 50.0
    theta: 0.2
    sigma: 0.5
    min_val: 0.0
    max_val: 100.0
  vibration:
    baseline: 0.02
    theta: 1.0
    sigma: 0.005
    min_val: 0.0
    max_val: 1.0
  background_light:
    baseline: 150.0
    theta: 0.5
    sigma: 5.0
    min_val: 0.0
  polarization_drift:
    baseline: 0.0
    theta: 0.1
    sigma: 0.05
    min_val: -10.0
    max_val: 10.0
  clock_drift:
    baseline: 15.0
    theta: 0.05
    sigma: 0.5
  channel_loss_drift:
    baseline: 0.0
    theta: 0.2
    sigma: 0.02
  source_intensity_drift:
    baseline: 0.0
    theta: 0.5
    sigma: 0.005
  detector_efficiency_drift:
    baseline: 0.0
    theta: 0.5
    sigma: 0.005
  coupling:
    ambient_light_to_bg_rate: 5.0
    base_background_rate_hz: 1000.0
  sensors:
    temperature:
      noise_std: 0.1
      quantization_step: 0.1
      missing_probability: 0.01
      sampling_interval_s: 0.001
    humidity:
      noise_std: 0.5
      quantization_step: 0.5
      missing_probability: 0.01
      sampling_interval_s: 0.001
    vibration:
      noise_std: 0.002
      quantization_step: 0.001
      missing_probability: 0.01
      sampling_interval_s: 0.001
    background_light:
      noise_std: 2.0
      quantization_step: 1.0
      missing_probability: 0.01
      sampling_interval_s: 0.001

attack:
  enabled: true
  type: intercept_resend
  strength: 0.75
  start_pulse: 3000
  end_pulse: 7000
  params:
    fraction: 1.0
  scenarios:
    - scenario_id: v04_smoke_ir
      type: intercept_resend
      severity: 0.75
      start_pulse: 3000
      end_pulse: 7000
      onset_pulses: 500
      termination_pulses: 500
      onset_profile: smoothstep
      recovery_profile: smoothstep
      params:
        fraction: 1.0
      description: "V0.4 smoke test intercept-resend attack under dynamic environmental baseline"

telemetry:
  window_size: 2000
  timing_histogram_bins: 20
  include_event_level: true
  interarrival_histogram_bins: 30
  interarrival_histogram_scale: linear
  fano_sub_bins: 64

simulation:
  master_seed: 20240401
  chunk_size: 2000
  checkpoint_interval: 2000
  output_root: data/smoke_v04
  checkpoint_root: checkpoints/smoke_v04
  scenario_id: v0.4_smoke
  log_level: INFO

dataset:
  format: parquet
  family: attacks
  version: 0.4.0
