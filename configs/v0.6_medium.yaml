# QISM V0.6 Medium Experiment Configuration
# Multi-model evaluation with neural architectures and feature ablation.

experiment_id: "v06_medium_experiment"
version: "0.6.0"
master_seed: 20260603

dataset_root: "data/v0.5_small/v05_small_dataset"
train_val_split_ratio: 0.70
output_dir: "experiments"

# Feature configuration
feature_set: "full"
add_temporal_features: true
rolling_window_length: 3

# Preprocessing
scaler: "robust"
impute_strategy: "median"
clip_sigma: 10.0

# Model configuration
model_type: "autoencoder"
hyperparameters:
  hidden_dim: 32
  latent_dim: 8
  lr: 0.001
  epochs: 25
  batch_size: 16
  early_stopping_patience: 5
  random_state: 42

# Thresholding
target_fpr: 0.01
consecutive_k: 2
