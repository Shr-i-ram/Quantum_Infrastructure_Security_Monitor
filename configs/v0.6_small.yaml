# QISM V0.6 Small Experiment Configuration
# Standard development and evaluation configuration.

experiment_id: "v06_small_experiment"
version: "0.6.0"
master_seed: 20260602

dataset_root: "data/v0.5_small/v05_small_dataset"
train_val_split_ratio: 0.70
output_dir: "experiments"

# Feature configuration
feature_set: "full"
add_temporal_features: true
rolling_window_length: 3

# Preprocessing
scaler: "standard"
impute_strategy: "median"
clip_sigma: 10.0

# Model configuration
model_type: "isolation_forest"
hyperparameters:
  n_estimators: 100
  contamination: "auto"
  random_state: 42

# Thresholding
target_fpr: 0.01
consecutive_k: 2
