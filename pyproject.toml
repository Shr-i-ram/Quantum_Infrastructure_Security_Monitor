[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qism-simulator"
version = "0.6.0"
description = "Quantum Infrastructure Security Monitor (QISM) — physics-informed stochastic telemetry simulator for QKD anomaly-detection research"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [{ name = "QISM contributors" }]
keywords = ["quantum-key-distribution", "BB84", "decoy-state", "simulation", "anomaly-detection", "telemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.24,<2.3",
    "scipy>=1.10,<1.16",
    "pandas>=2.0,<2.3",
    "pydantic>=2.5,<3.0",
    "PyYAML>=6.0,<7.0",
    "pyarrow>=14.0,<20.0",
    "tqdm>=4.66,<5.0",
    "matplotlib>=3.7,<4.0",
    "scikit-learn>=1.2.0,<1.8.0",
    "torch>=2.0.0,<2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "ruff>=0.4,<1.0",
    "jupyter>=1.0,<2.0",
    "ipykernel>=6.25,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]