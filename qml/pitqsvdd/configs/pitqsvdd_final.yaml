# QISM PI-TQSVDD — Final Training Configuration (Mode C)
# Physics-Informed Temporal Quantum SVDD on QKD Telemetry
# To execute:
#   python -m qml.pitqsvdd.train --config qml/pitqsvdd/configs/pitqsvdd_final.yaml --run-id pitqsvdd_final --resume auto

data:
  dataset_root: data/v0.5_small/v05_small_dataset
  representation: highdim_pca
  n_qubits: 4
  sequence_length: 3
  temporal_stride: 1
  master_seed: 42
  normal_only_training: true
  train_val_ratio: 0.70

circuit:
  n_qubits: 4
  n_layers: 2
  encoding_type: data_reuploading
  entanglement: ring
  rotation: Y
  backend: lightning.qubit
  diff_method: adjoint
  reupload_blocks: 2

model:
  model_type: temporal_pitqsvdd
  lambda_temporal: 0.5
  lambda_reg: 0.0001
  temporal_hidden_dim: 16
  num_regimes: 2
  centre_init: train_mean
  fix_centre: true
  bottleneck_hidden_dim: 24

training:
  lr: 0.01
  weight_decay: 0.0001
  batch_size: 8
  max_epochs: 30
  early_stopping_patience: 8
  grad_clip: 1.0
  checkpoint_freq: 5
  save_dir: artifacts/pi_tqsvdd/checkpoints
  run_id: pitqsvdd_final
  resume_mode: auto
  resume_path: null
  overwrite: false

evaluation:
  threshold_percentile: 95.0
  alpha_svdd: 0.5
  beta_temporal: 0.5
  persistence_window: 1
  output_dir: artifacts/pi_tqsvdd
