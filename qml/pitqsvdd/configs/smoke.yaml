data:
  dataset_root: data/v0.5_small/v05_small_dataset
  representation: pca
  n_qubits: 2
  sequence_length: 2
  temporal_stride: 1
  master_seed: 42
  normal_only_training: true
  train_val_ratio: 0.70

circuit:
  n_qubits: 2
  n_layers: 1
  encoding_type: angle
  entanglement: ring
  rotation: Y
  backend: lightning.qubit
  diff_method: adjoint
  reupload_blocks: 1

model:
  model_type: temporal_pitqsvdd
  lambda_temporal: 0.5
  lambda_reg: 0.0001
  temporal_hidden_dim: 8
  num_regimes: 2
  centre_init: train_mean
  fix_centre: true
  bottleneck_hidden_dim: 16

training:
  lr: 0.01
  weight_decay: 0.0001
  batch_size: 4
  max_epochs: 2
  early_stopping_patience: 5
  grad_clip: 1.0
  checkpoint_freq: 1
  save_dir: artifacts/pi_tqsvdd/checkpoints
  run_id: pitqsvdd_smoke
  resume_mode: auto
  resume_path: null
  overwrite: false

evaluation:
  threshold_percentile: 95.0
  alpha_svdd: 0.5
  beta_temporal: 0.5
  persistence_window: 1
  output_dir: artifacts/pi_tqsvdd
